<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTE — Мои заметки</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="app">
    <aside>
        <div class="logo"><span>▤</span> NOTE</div>
        <button>+ Новая заметка</button>
        <nav class="menu">
            <button class="active">▦ Все заметки</button>
            <button>☆ Избранное</button>
            <button>📁 Мои папки</button>
            <button>🗑 Корзина</button>
        </nav>
        <div class="profile">
            <strong>testLogin</strong>
            <p style="color:#888;margin-top:5px">test@email.com</p>
        </div>
    </aside>

    <main>
        <header>
            <h1>Мои заметки</h1>
            <input type="search" placeholder="⌕ Поиск заметок...">
        </header>

        <div class="toolbar">
            <button>+ Создать</button>
            <button class="secondary">✎ Редактировать</button>
            <button class="danger">Удалить</button>
        </div>

        <section class="notes">
            <article class="note">
                <h3>Идеи для проекта</h3>
                <p>Собрать идеи, задачи и планы для следующего проекта.</p>
                <span class="tag">Работа</span>
            </article>
            <article class="note">
                <h3>Планы на неделю</h3>
                <p>Распределить задачи и определить главные приоритеты.</p>
                <span class="tag">Личное</span>
            </article>
            <article class="note">
                <h3>Список покупок</h3>
                <p>Продукты, необходимые вещи и покупки для дома.</p>
                <span class="tag">Быт</span>
            </article>
        </section>
    </main>
</div>
</body>
</html>
