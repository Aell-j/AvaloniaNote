<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/register.css">
    <title>Register Page</title>
</head>

<body class="light-theme">
<div class="register-card">
    <h1>Страница регистрации</h1>
    <h2>Project: NOTES</h2>
    <p>Создайте свой аккаунт</p>

    <input type="text" id="email_register" placeholder="Email" autocomplete="on" required>
    <input type="text" id="login_register" placeholder="Логин" autocomplete="on" required>
    <input type="text" id="password_register" placeholder="Пароль" autocomplete="on" required>

    <button id="btn_register">Вызвать API</button>
    <p id="result_register"></p>
</div>

<div class="login_link">
    <a href="login.html">Уже есть аккаунт</a>
</div>
<script src="./js/register.js"></script>
</body>
</html>
